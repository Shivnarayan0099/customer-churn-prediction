<!DOCTYPE html>
<html>

<head>

    <title>Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        .card{

            width:400px;

            margin:20px auto;

            padding:25px;

            background:white;

            border-radius:15px;

            box-shadow:0 5px 15px rgba(0,0,0,.15);

            font-size:28px;

            font-weight:bold;

            text-align:center;

        }

        .card img{

            margin-top:15px;

            border-radius:10px;

        }

        .btn-container{

            display:flex;

            justify-content:center;

            gap:20px;

            flex-wrap:wrap;

            margin-top:30px;

        }

        .btn-container a{

            text-decoration:none;

        }

        .btn-container button{

            padding:12px 25px;

            font-size:16px;

            border:none;

            border-radius:8px;

            background:#0d6efd;

            color:white;

            cursor:pointer;

            transition:.3s;

        }

        .btn-container button:hover{

            background:#0b5ed7;

        }

    </style>

</head>

<body>

<div class="container">

<h1>Customer Churn Dashboard</h1>

<div class="card">

📊 Total Predictions

<br><br>

{{ total }}

</div>

<div class="card">

🟢 Customer Will Not Churn

<br><br>

{{ not_churn }}

</div>

<div class="card">

🔴 Customer Will Churn

<br><br>

{{ churn }}

</div>

<div class="card">

⭐ Average Confidence

<br><br>

{{ avg_confidence }}%

</div>

<div class="card">

<h2>Customer Churn Distribution</h2>

<img
src="{{ url_for('static', filename='pie_chart.png') }}?{{ total }}"
width="320">

</div>
<div class="card">

    <h2>Customer Churn Count</h2>

    <img
    src="{{ url_for('static', filename='bar_chart.png') }}"
    width="350">

</div>
<div class="btn-container">

<a href="/history">
<button>📜 History</button>
</a>

<a href="/">
<button>🏠 Home</button>
</a>

</div>

</div>

</body>

</html>
