<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Churn Analytics</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="background-overlay"></div>

<div class="container">

<div class="header">

<h1>
<i class="fa-solid fa-chart-line"></i>
Customer Churn Analytics
</h1>

<p>
AI Powered Customer Retention Prediction System
</p>

</div>

<form action="/predict" method="POST">

<div class="form-grid">

<div class="form-group">

<label>
<i class="fa-solid fa-user"></i>
Gender
</label>

<select name="gender">

<option value="0">Female</option>

<option value="1">Male</option>

</select>

</div>

<div class="form-group">

<label>
<i class="fa-solid fa-user-check"></i>
Senior Citizen
</label>

<select name="SeniorCitizen">

<option value="0">No</option>

<option value="1">Yes</option>

</select>

</div>

<div class="form-group">

<label>
<i class="fa-solid fa-heart"></i>
Partner
</label>

<select name="Partner">

<option value="0">No</option>

<option value="1">Yes</option>

</select>

</div>

<div class="form-group">

<label>
<i class="fa-solid fa-people-group"></i>
Dependents
</label>

<select name="Dependents">

<option value="0">No</option>

<option value="1">Yes</option>

</select>

</div>

<div class="form-group">

<label>
<i class="fa-solid fa-calendar"></i>
Tenure (Months)
</label>

<input
type="number"
name="tenure"
placeholder="Enter tenure"
required>

</div>

<div class="form-group">

<label>
<i class="fa-solid fa-phone"></i>
Phone Service
</label>

<select name="PhoneService">

<option value="0">No</option>

<option value="1">Yes</option>

</select>

</div>

<div class="form-group">

<label>
<i class="fa-solid fa-network-wired"></i>
Multiple Lines
</label>

<select name="MultipleLines">

<option value="0">No</option>

<option value="1">No Phone Service</option>

<option value="2">Yes</option>

</select>

</div>

<div class="form-group">

<label>
<i class="fa-solid fa-wifi"></i>
Internet Service
</label>

<select name="InternetService">

<option value="0">DSL</option>

<option value="1">Fiber Optic</option>

<option value="2">No</option>

</select>

</div>

<div class="form-group">

<label>
<i class="fa-solid fa-indian-rupee-sign"></i>
Monthly Charges
</label>

<input
type="number"
step="0.01"
name="MonthlyCharges"
placeholder="Monthly Charges"
required>

</div>

<div class="form-group">

<label>
<i class="fa-solid fa-wallet"></i>
Total Charges
</label>

<input
type="number"
step="0.01"
name="TotalCharges"
placeholder="Total Charges"
required>

</div>

<div class="form-group">

<label>
<i class="fa-solid fa-shield-halved"></i>
Online Security
</label>

<select name="OnlineSecurity">

<option value="0">No</option>

<option value="1">No Internet Service</option>

<option value="2">Yes</option>

</select>

</div>

<div class="form-group">

<label>
<i class="fa-solid fa-cloud-arrow-up"></i>
Online Backup
</label>

<select name="OnlineBackup">

<option value="0">No</option>

<option value="1">No Internet Service</option>

<option value="2">Yes</option>

</select>

</div>

<div class="form-group">

<label>
<i class="fa-solid fa-mobile-screen-button"></i>
Device Protection
</label>

<select name="DeviceProtection">

<option value="0">No</option>

<option value="1">No Internet Service</option>

<option value="2">Yes</option>

</select>

</div>

<div class="form-group">

<label>
<i class="fa-solid fa-headset"></i>
Tech Support
</label>

<select name="TechSupport">

<option value="0">No</option>

<option value="1">No Internet Service</option>

<option value="2">Yes</option>

</select>

</div>

<div class="form-group">

<label>
<i class="fa-solid fa-tv"></i>
Streaming TV
</label>

<select name="StreamingTV">

<option value="0">No</option>

<option value="1">No Internet Service</option>

<option value="2">Yes</option>

</select>

</div>

<div class="form-group">

<label>
<i class="fa-solid fa-film"></i>
Streaming Movies
</label>

<select name="StreamingMovies">

<option value="0">No</option>

<option value="1">No Internet Service</option>

<option value="2">Yes</option>

</select>

</div>

<div class="form-group">

<label>
<i class="fa-solid fa-file-contract"></i>
Contract
</label>

<select name="Contract">

<option value="0">Month-to-month</option>

<option value="1">One Year</option>

<option value="2">Two Year</option>

</select>

</div>

<div class="form-group">

<label>
<i class="fa-solid fa-file-invoice-dollar"></i>
Paperless Billing
</label>

<select name="PaperlessBilling">

<option value="0">No</option>

<option value="1">Yes</option>

</select>

</div>

<div class="form-group full-width">

<label>
<i class="fa-solid fa-credit-card"></i>
Payment Method
</label>

<select name="PaymentMethod">

<option value="0">Bank Transfer (Automatic)</option>

<option value="1">Credit Card (Automatic)</option>

<option value="2">Electronic Check</option>

<option value="3">Mailed Check</option>

</select>

</div>

</div>

<div class="button-group">

<button type="submit" class="predict-btn">

<i class="fa-solid fa-brain"></i>

Predict Customer Churn

</button>

<a href="/dashboard" class="nav-btn">

<i class="fa-solid fa-chart-column"></i>

Dashboard

</a>

<a href="/history" class="nav-btn">

<i class="fa-solid fa-clock-rotate-left"></i>

History

</a>

</div>

</form>

<div class="footer">

<p>

<i class="fa-solid fa-shield-halved"></i>

Powered by Machine Learning • Flask • Scikit-learn • SQLite

</p>

</div>

</div>

</body>

</html>
